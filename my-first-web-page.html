<!DOCTYPE html>
<!-- Declares this file as an HTML5 document so the browser renders it in standards mode -->
<html lang="en">
<!-- Opens the root element; lang="en" tells browsers and screen readers the page is in English -->
<head>
    <!-- Opens the head section: information about the page that is not displayed directly -->
    <meta charset="UTF-8">
    <!-- Sets the character encoding to UTF-8 so symbols like the copyright sign display correctly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the page scale properly on phones and small screens -->
    <title>My First Web Page</title>
    <!-- Sets the text shown on the browser tab -->
    <style>
        /* Opens the CSS block that styles the page */
        body {
            /* Styles everything inside the body */
            font-family: Arial, sans-serif; /* Uses Arial, falling back to any sans-serif font */
            max-width: 700px;               /* Keeps the text from stretching too wide */
            margin: 40px auto;              /* Adds space on top and centers the content horizontally */
            padding: 0 20px;                /* Adds side padding for small screens */
            line-height: 1.6;               /* Adds spacing between lines for readability */
            color: #222;                    /* Sets the text color to a dark gray */
        }
        h1 {
            color: #1a4d8f;                 /* Makes the main heading blue */
        }
        footer {
            margin-top: 40px;               /* Adds space above the footer */
            padding-top: 10px;              /* Adds space between the line and footer text */
            border-top: 1px solid #ccc;     /* Draws a thin gray line above the footer */
            font-size: 0.9em;               /* Makes the footer text slightly smaller */
            color: #555;                    /* Makes the footer text medium gray */
        }
    </style>
    <!-- Closes the CSS block -->
</head>
<!-- Closes the head section -->
<body>
    <!-- Opens the body section: everything visitors see on the page goes here -->
    <h1>Welcome to My First Web Page</h1>
    <!-- Main heading (largest heading level) -->

    <p><strong>Username:</strong> Rumsfield Dsani (rna36)</p>
    <!-- Paragraph showing the username (name and UCID). <strong> makes the label bold -->
    <p><strong>Course Name:</strong> Introduction to Website Development</p>
    <!-- Paragraph showing the course name -->
    <p><strong>Course Number:</strong> IS 117</p>
    <!-- Paragraph showing the course number -->
    <p><strong>Course Section:</strong> 001</p>
    <!-- Paragraph showing the course section -->

    <footer>
        <!-- Opens the footer, which holds closing information for the page -->
        <p>&copy; Rumsfield Dsani | Due Date: October 6, 2026</p>
        <!-- &copy; displays the copyright symbol, followed by the author name and the assignment due date -->
    </footer>
    <!-- Closes the footer -->
</body>
<!-- Closes the body section -->
</html>
<!-- Closes the root html element, ending the document -->
